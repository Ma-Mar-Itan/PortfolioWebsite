name: Validate site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Install portfolio tooling
        run: python -m pip install -e .
      - name: Check Python syntax
        run: python -m compileall -q portfolio_figures scripts prototypes research
      - name: Render from frozen research results
        run: quarto render
      - name: Check local links and assets
        run: python scripts/check_site.py _site
