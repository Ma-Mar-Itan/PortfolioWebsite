<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-label="Systems Decision Lab thumbnail: dense workload rows condensing into a metadata table above an event timeline">
  <!-- dense logical workload: many thin rows -->
  <g fill="#a5504a">
    <rect x="24" y="30" width="104" height="3" rx="1.5" opacity="0.18"/>
    <rect x="24" y="38" width="86"  height="3" rx="1.5" opacity="0.20"/>
    <rect x="24" y="46" width="118" height="3" rx="1.5" opacity="0.16"/>
    <rect x="24" y="54" width="72"  height="3" rx="1.5" opacity="0.22"/>
    <rect x="24" y="62" width="110" height="3" rx="1.5" opacity="0.18"/>
    <rect x="24" y="70" width="94"  height="3" rx="1.5" opacity="0.24"/>
    <rect x="24" y="78" width="126" height="3" rx="1.5" opacity="0.16"/>
    <rect x="24" y="86" width="80"  height="3" rx="1.5" opacity="0.20"/>
    <rect x="24" y="94" width="112" height="3" rx="1.5" opacity="0.18"/>
    <rect x="24" y="102" width="90" height="3" rx="1.5" opacity="0.22"/>
  </g>

  <!-- condensation arrow -->
  <path d="M168 66 h34 m-9 -7 l9 7 -9 7" fill="none" stroke="#a5504a" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- canonical metadata rows -->
  <g fill="#a5504a">
    <rect x="216" y="34" width="160" height="11" rx="3" opacity="0.85"/>
    <rect x="216" y="52" width="160" height="11" rx="3" opacity="0.55"/>
    <rect x="216" y="70" width="160" height="11" rx="3" opacity="0.40"/>
    <rect x="216" y="88" width="160" height="11" rx="3" opacity="0.28"/>
  </g>
  <g stroke="#fdfdfc" stroke-width="2" opacity="0.9">
    <line x1="262" y1="34" x2="262" y2="99"/>
    <line x1="316" y1="34" x2="316" y2="99"/>
  </g>

  <!-- event timeline: the virtual clock jumps between events -->
  <line x1="24" y1="178" x2="376" y2="178" stroke="#a5504a" stroke-width="1.5" opacity="0.35"/>
  <path d="M24 178 v-14 h38 v22 h44 v-30 h30 v18 h52 v-26 h36 v34 h48 v-20 h40 v14 h64"
        fill="none" stroke="#a5504a" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <g fill="#a5504a">
    <circle cx="62"  cy="164" r="3.2"/>
    <circle cx="106" cy="186" r="3.2"/>
    <circle cx="136" cy="156" r="3.2"/>
    <circle cx="188" cy="174" r="3.2"/>
    <circle cx="224" cy="148" r="3.2"/>
    <circle cx="272" cy="182" r="3.2"/>
    <circle cx="312" cy="162" r="3.2"/>
  </g>
</svg>
