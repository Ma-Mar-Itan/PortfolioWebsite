[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "malek-portfolio-tools"
version = "0.1.0"
description = "Shared data and figure tooling for the portfolio website"
requires-python = ">=3.10"
dependencies = [
  "jupyter>=1.1,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["portfolio_figures*"]
